    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900;1000&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: { bgDark: '#08080A', cardDark: '#111216', goldBase: '#D4AF37' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #08080A; color: #E5E7EB; }
        .text-gold-gradient {
            background: linear-gradient(135deg, #FFF5CC 0%, #E6C200 25%, #D4AF37 50%, #997A00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-gold {
            background: rgba(17, 18, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .glass-gold:hover {
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }
        #intro-screen { 
            position: fixed; inset: 0; z-index: 99999; background-color: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .glow-gold-pulse {
            animation: goldPulse 2s infinite alternate ease-in-out;
        }
        @keyframes goldPulse {
            0% { filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3)); transform: scale(0.98); }
            100% { filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.8)); transform: scale(1.02); }
        }
        .hero-bg {
            background: linear-gradient(180deg, rgba(8,8,10,0.65) 0%, rgba(8,8,10,0.95) 100%), 
                        url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center;
        }
    </style>
</head>
